<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="泪叶丝的个人博客，分享技术、生活和思考">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="泪叶丝的个人博客">
  <meta property="og:description" content="探索网络技术, 记录生活点滴, 分享有趣思考">
  <meta name="robots" content="index, follow">
  <title>泪叶丝的个人博客</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    body {
      background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('assets/1.png');
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    main, .content {
      background: transparent;
    }

    section.cover {
      background: rgba(255, 255, 255, 0.2);
    }

    section.cover.has-mask .mask {
      opacity: 0;
    }

    .markdown-section {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 30px;
      margin-top: 20px;
    }

    .sidebar {
      position: relative;
      background-color: rgba(255, 255, 255, 0.6);
      border-right: none;
    }

    .cover-main h1, .cover-main p, .cover-main blockquote {
      color: #333;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    /* 使图片和文本自适应 */
    .markdown-section img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
    }

    .markdown-section p, .markdown-section li, .markdown-section blockquote {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px;
        margin-top: 10px;
      }

      /* 移动端侧边栏修复：无论正文滚动到哪里，目录都应完整显示 */
      .sidebar {
        position: fixed !important;
        top: 0;
        bottom: 0;
        height: 100vh;
        max-height: 100vh;
        overflow-y: auto;
        z-index: 300;
      }

      .sidebar-toggle {
        z-index: 301;
      }
    }

    /* 封面访客统计模块 - 左下角固定 */
    .cover-stats {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 200;
      display: none; /* 默认隐藏，仅封面页显示 */
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.82em;
      color: #555;
      line-height: 1.8;
    }

    .cover-stats.visible {
      display: block;
    }

    .cover-stats .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cover-stats .stat-label {
      opacity: 0.75;
    }

    .cover-stats .stat-value {
      font-weight: 600;
      color: #333;
    }

    /* 深色模式适配 */
    @media (prefers-color-scheme: dark) {
      .cover-stats {
        background: rgba(20, 20, 20, 0.35);
        color: #bbb;
      }

      .cover-stats .stat-value {
        color: #e0e0e0;
      }
    }

    /* 手机端：居中显示在底部，不遮挡正文 */
    @media (max-width: 768px) {
      .cover-stats {
        left: 50%;
        transform: translateX(-50%);
        bottom: 16px;
        white-space: nowrap;
      }
    }
  </style>

  <!-- 百度统计：站点访问数据 -->
  <script>
    var _hmt = _hmt || [];
    // docsify 为 hash 路由：关闭自动 PV，改由 doneEach 钩子手动上报，避免漏记路由切换与首页重复计数
    _hmt.push(['_setAutoPageview', false]);
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?9b88f8eece2f9ad20b8f6621817311ca";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
</head>
<body>
  <div id="app">加载中...</div>

  <!-- 封面左下角：本机到访次数（仅当前浏览器，站点总量见百度统计） -->
  <div id="cover-stats" class="cover-stats" role="status" aria-live="polite">
    <div class="stat-row">
      <span class="stat-label">👁️ 你已到访</span>
      <span id="self_visit_count" class="stat-value">--</span>
      <span class="stat-label">次</span>
    </div>
  </div>

  <script>
    window.$docsify = {
      name: 'LAYYES',
      nameLink: '/', // 确保点击左上角名字跳转回根目录
      repo: 'worldfunction4/worldfunction4.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      onlyCover: false, 
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
      },
      // 插件：当路由回到首页时，确保封面正常显示
      plugins: [
        function(hook, vm) {
          // 页面切换时控制封面统计显示
          hook.doneEach(function() {
            // hash 路由下每次渲染手动上报一次 PV
            if (window._hmt) {
              window._hmt.push(['_trackPageview', location.pathname + location.hash]);
            }

            const statsEl = document.getElementById('cover-stats');
            if (!statsEl) return;

            const isHome = vm.route.path === '/' || vm.route.path === '/README';
            if (isHome) {
              statsEl.classList.add('visible');
              const count = document.getElementById('self_visit_count');
              if (count && window._layyesSelfVisits) {
                count.textContent = window._layyesSelfVisits;
              }
            } else {
              statsEl.classList.remove('visible');
            }
          });
        }
      ]
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <script>
    // 本机到访计数：仅反映当前浏览器的到访次数
    (function() {
      function initSelfVisits() {
        var n = parseInt(localStorage.getItem('layyes_self_visits') || '0', 10) + 1;
        localStorage.setItem('layyes_self_visits', String(n));
        window._layyesSelfVisits = String(n);

        var el = document.getElementById('self_visit_count');
        if (el) {
          el.textContent = window._layyesSelfVisits;
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSelfVisits);
      } else {
        initSelfVisits();
      }
    })();
  </script>
</body>
</html>
